# ─────────────────────────────────────────────────────────────────────
# Conf DEV — https://localhost, certificat auto-signé généré dans l'image
# (voir nginx/dockerfile). Seule porte d'entrée du navigateur en dev : les
# ports 3000 et 8000 ne sont plus publiés, tout passe en HTTPS ici.
# La conf de production est dans nginx.prod.conf.
# ─────────────────────────────────────────────────────────────────────

# Redirection HTTP -> HTTPS.
# Le port 8443 est écrit en dur : $host ne porte pas le port, et le conteneur
# est publié sur 8443 côté hôte (cf. docker-compose.override.yml). Si tu
# changes le port publié, change-le ici aussi.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

# Reverse proxy HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Entêtes communs transmis à l'app finale.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API REST Django ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ── WebSockets (chat + notifications, channels/daphne) ────────────
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Admin & statiques Django (servis par WhiteNoise) ──────────────
    location /admin/ {
        proxy_pass http://backend:8000;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # ── Médias uploadés ───────────────────────────────────────────────
    # En dev c'est Django qui les sert (urls.py, bloc `if settings.DEBUG`),
    # contrairement à la prod où nginx lit directement le volume.
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # ── Frontend Next.js ──────────────────────────────────────────────
    # Le bloc upgrade sert aussi au rechargement à chaud de Next (HMR),
    # qui passe par un WebSocket sur la même origine.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
