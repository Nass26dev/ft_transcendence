# ─────────────────────────────────────────────────────────────────────
# Conf PROD — kop.life, certificat Let's Encrypt (obtenu/renouvelé
# automatiquement par l'image jonasal/nginx-certbot au lancement).
# La conf dev/local reste dans nginx.conf (localhost, auto-signé).
# ─────────────────────────────────────────────────────────────────────

# HTTP : sert le challenge ACME, redirige le reste vers HTTPS.
server {
    listen 80;
    server_name kop.life www.kop.life;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : reverse proxy.
server {
    listen 443 ssl;
    server_name kop.life www.kop.life;

    ssl_certificate     /etc/letsencrypt/live/kop.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kop.life/privkey.pem;

    # Entêtes communs transmis à l'app finale.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API REST Django ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ── WebSockets (chat + notifications, channels/daphne) ────────────
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Admin & statiques Django (servis par WhiteNoise) ──────────────
    location /admin/ {
        proxy_pass http://backend:8000;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # ── Frontend Next.js ──────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
