# ─────────────────────────────────────────────────────────────────────
# DEV — appliqué automatiquement par `docker compose up` par-dessus
# docker-compose.yml (prod). Hot-reload, serveurs de dev, ports exposés.
# Ne PAS passer ce fichier en prod (utiliser -f docker-compose.yml --profile prod).
# ─────────────────────────────────────────────────────────────────────
services:
  db:
    ports:
      - "5432:5432"

  celery_worker:
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - ./api:/app

  celery_beat:
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - ./api:/app

  backend:
    restart: "no"
    environment:
      DJANGO_DEBUG: "True"
      # Remet les valeurs dev (la base = prod = kop.life).
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py seed_if_empty &&
             python3 manage.py runserver 0.0.0.0:8000"

  frontend:
    restart: "no"
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev
