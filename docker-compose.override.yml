services:
  db:
    ports:
      - "5432:5432"

  celery_worker:
    volumes:
      - ./api:/app

  celery_beat:
    volumes:
      - ./api:/app

  caddy_dev:
    image: caddy:2-alpine
    container_name: t_caddy_dev
    restart: "no"
    ports:
      - "8080:8080"
      - "8443:8443"
      # Publiés ici (pas sur le service `selenium`) car il partage le netns
      # de caddy_dev (cf. plus bas) : "localhost" y désigne donc caddy_dev,
      # exactement comme dans le navigateur d'un vrai utilisateur — le
      # frontend appelle NEXT_PUBLIC_API_URL=https://localhost:8443 en dur,
      # peu importe le Host header de la page qui a fait la requête.
      - "4444:4444"
      - "7900:7900"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - t_networks

  backend:
    restart: "no"
    volumes:
      - ./api:/app
    command: >
      sh -c "python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py seed_if_empty &&
             python3 manage.py runserver 0.0.0.0:8000"

  frontend:
    restart: "no"
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: t_selenium
    restart: "no"
    shm_size: "2gb"
    # Partage le netns de caddy_dev plutôt qu'un réseau propre : le frontend
    # a NEXT_PUBLIC_API_URL=https://localhost:8443 inlinée en dur au build,
    # donc Chrome doit voir EXACTEMENT le "localhost" de caddy_dev pour que
    # les appels API du SPA (pas seulement la navigation initiale) marchent.
    network_mode: "service:caddy_dev"
    depends_on:
      - caddy_dev
    profiles:
      - e2e

volumes:
  caddy_dev_data:
  caddy_dev_config:
