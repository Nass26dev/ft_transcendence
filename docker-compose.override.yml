# ─────────────────────────────────────────────────────────────────────
# DEV — appliqué automatiquement par `docker compose up` par-dessus
# docker-compose.yml (prod). Hot-reload, serveurs de dev, ports exposés.
# Ne PAS passer ce fichier en prod (utiliser -f docker-compose.yml --profile prod).
#
# Ici on ne touche QUE l'infra dev (montages code, ports, commandes).
# Le mode dev de Django (DEBUG, hôtes, CORS) se règle via DJANGO_DEBUG=True
# dans .env — aucune variable d'app n'est injectée dans le compose.
# ─────────────────────────────────────────────────────────────────────
services:
  db:
    ports:
      - "5432:5432"

  celery_worker:
    volumes:
      - ./api:/app

  celery_beat:
    volumes:
      - ./api:/app

  # Reverse proxy TLS du dev : seule porte d'entrée du navigateur.
  # Le sujet impose HTTPS pour toute connexion navigateur → backend, donc
  # backend et frontend ne publient plus leurs ports sur l'hôte.
  nginx_dev:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: t_nginx_dev
    restart: "no"
    # Ports hauts : Docker en mode rootless (courant sur les postes 42) ne
    # peut pas se lier aux ports privilégiés 80/443.
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - t_networks

  backend:
    restart: "no"
    volumes:
      - ./api:/app
    command: >
      sh -c "python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py seed_if_empty &&
             python3 manage.py runserver 0.0.0.0:8000"

  frontend:
    restart: "no"
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
