# ─────────────────────────────────────────────────────────────────────
# DEV — appliqué automatiquement par `docker compose up` par-dessus
# docker-compose.yml (prod). Hot-reload, serveurs de dev, ports exposés.
# Ne PAS passer ce fichier en prod (utiliser -f docker-compose.yml --profile prod).
#
# Ici on ne touche QUE l'infra dev (montages code, ports, commandes).
# Le mode dev de Django (DEBUG, hôtes, CORS) se règle via DJANGO_DEBUG=True
# dans .env — aucune variable d'app n'est injectée dans le compose.
# ─────────────────────────────────────────────────────────────────────
services:
  db:
    ports:
      - "5432:5432"

  celery_worker:
    volumes:
      - ./api:/app

  celery_beat:
    volumes:
      - ./api:/app

  backend:
    restart: "no"
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py seed_if_empty &&
             python3 manage.py runserver 0.0.0.0:8000"

  frontend:
    restart: "no"
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev
