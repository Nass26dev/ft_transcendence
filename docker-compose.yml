services:
  #nginx:
   #container_name: nginx
    #restart: always
    #ports:
    #  - "80:80"
    #  - "443:443"
    #volumes:
    # - ./nginx/conf:/etc/nginx/conf.d 
    # - ./nginx/certs:/etc/nginx/certs 
    #networks:
    # - t_networks
    #depends_on:
    # - frontend
    #- backend
  db:
    ports:
      - "5432:5432"
    image: postgres:16
    container_name: t_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - t_networks

  redis:
    image: redis:7-alpine
    container_name: t_redis
    networks:
      - t_networks

  celery_worker:
    build: ./api
    container_name: t_celery_w
    command: celery -A core worker -l info
    volumes:
      - ./api:/app
    depends_on:
      - redis
      - db
    env_file: .env
    networks:
      - t_networks

  celery_beat:
    build: ./api
    container_name: t_celery_b
    command: celery -A core beat -l info
    volumes:
      - ./api:/app
    depends_on:
      - redis
      - db
    env_file: .env
    networks:
      - t_networks

  backend:
    build: ./api
    env_file:
      - .env
    container_name: t_backend
    volumes:
      - ./api:/app
    networks:
      - t_networks
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    env_file:
      - .env
    container_name: t_frontend
    networks:
      - t_networks
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:

networks:
  t_networks:
    driver: bridge