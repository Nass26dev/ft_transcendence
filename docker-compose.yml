# ─────────────────────────────────────────────────────────────────────
# Définition canonique = PROD.
#   • Dev  : `docker compose up`                          (override.yml appliqué automatiquement)
#   • Prod : `docker compose -f docker-compose.yml --profile prod up -d --build`
# docker-compose.override.yml ramène les réglages dev par-dessus ce fichier.
# nginx est sous le profil "prod" : il ne démarre qu'en prod.
# ─────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    container_name: t_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - t_networks

  redis:
    image: redis:7-alpine
    container_name: t_redis
    restart: always
    networks:
      - t_networks

  celery_worker:
    build: ./api
    container_name: t_celery_w
    # Attend que les migrations soient appliquées avant de consommer des tâches.
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'worker: attente des migrations...'; sleep 2; done &&
             celery -A core worker -l info"
    restart: on-failure
    env_file: .env
    environment:
      DJANGO_DEBUG: "True"
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  celery_beat:
    build: ./api
    container_name: t_celery_b
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'beat: attente des migrations...'; sleep 2; done &&
             celery -A core beat -l info"
    restart: on-failure
    env_file: .env
    environment:
      DJANGO_DEBUG: "True"
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  backend:
    build: ./api
    container_name: t_backend
    restart: always
    env_file: .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-kop.life,www.kop.life}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://kop.life,https://www.kop.life}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://kop.life,https://www.kop.life}
    # ASGI (daphne) car l'app utilise des websockets (chat + notifications).
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    networks:
      - t_networks

  frontend:
    build:
      context: ./frontend
      target: runner
      # NEXT_PUBLIC_* sont inlinées au build. En prod le navigateur passe par
      # nginx (443) : pointer l'API sur https://localhost (surchargeable via .env).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_PROD:-https://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: t_frontend
    restart: always
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - t_networks

  nginx:
    # Image nginx + certbot : obtient et renouvelle le cert Let's Encrypt
    # automatiquement au lancement (à partir des domaines de nginx.prod.conf).
    image: jonasal/nginx-certbot:5-alpine
    container_name: t_nginx
    restart: always
    # Profil "prod" : ignoré par `docker compose up` (dev), démarré avec --profile prod.
    profiles:
      - prod
    environment:
      # Email d'enregistrement Let's Encrypt (à définir dans .env).
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/user_conf.d/kop.conf:ro
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - t_networks

volumes:
  postgres_data:
  letsencrypt:

networks:
  t_networks:
    driver: bridge
