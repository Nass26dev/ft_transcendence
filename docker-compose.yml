services:
  db:
    image: postgres:16
    container_name: transcendence_db
    restart: always
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: transcendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./api
    container_name: transcendence_backend
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: transcendence
      DB_USER: transcendence
      DB_PASSWORD: transcendence
      DB_HOST: db
      DB_PORT: 5432
    command: python3 manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: transcendence_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data: