# ─────────────────────────────────────────────────────────────────────
# Base commune dev + prod.
#   • Dev  : `docker compose up`            (override.yml chargé automatiquement)
#   • Prod : `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# Les différences (command, volumes, ports, DEBUG) vivent dans les fichiers
# docker-compose.override.yml (dev) et docker-compose.prod.yml (prod).
# ─────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    container_name: t_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - t_networks

  redis:
    image: redis:7-alpine
    container_name: t_redis
    restart: always
    networks:
      - t_networks

  celery_worker:
    build: ./api
    container_name: t_celery_w
    # Attend que les migrations soient appliquées avant de consommer des tâches.
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'worker: attente des migrations...'; sleep 2; done &&
             celery -A core worker -l info"
    restart: on-failure
    env_file: .env
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  celery_beat:
    build: ./api
    container_name: t_celery_b
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'beat: attente des migrations...'; sleep 2; done &&
             celery -A core beat -l info"
    restart: on-failure
    env_file: .env
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  backend:
    build: ./api
    container_name: t_backend
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - t_networks

  frontend:
    build:
      context: ./frontend
    container_name: t_frontend
    env_file: .env
    depends_on:
      - backend
    networks:
      - t_networks

volumes:
  postgres_data:

networks:
  t_networks:
    driver: bridge
