services:
  db:
    image: postgres:16
    container_name: t_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - t_networks

  redis:
    image: redis:7-alpine
    container_name: t_redis
    restart: always
    networks:
      - t_networks

  celery_worker:
    build: ./api
    container_name: t_celery_w
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'worker: attente des migrations...'; sleep 2; done &&
             celery -A core worker -l info"
    restart: on-failure
    env_file: .env
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  celery_beat:
    build: ./api
    container_name: t_celery_b
    command: >
      sh -c "until python3 manage.py migrate --check >/dev/null 2>&1; do echo 'beat: attente des migrations...'; sleep 2; done &&
             celery -A core beat -l info"
    restart: on-failure
    env_file: .env
    depends_on:
      - redis
      - db
    networks:
      - t_networks

  backend:
    build: ./api
    container_name: t_backend
    restart: always
    env_file: .env
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - media:/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    networks:
      - t_networks

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_PROD:-https://kop.life}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: t_frontend
    restart: always
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - t_networks

  caddy:
    image: caddy:2-alpine
    container_name: t_caddy
    restart: always
    profiles:
      - prod
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - t_networks

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media:

networks:
  t_networks:
    driver: bridge
