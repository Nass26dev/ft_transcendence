# ─────────────────────────────────────────────────────────────────────
# PROD — `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`
# Images figées (pas de volume source), serveurs de prod, nginx en façade (TLS).
# Seul nginx est exposé (80/443) ; backend et frontend ne le sont qu'en interne.
# ─────────────────────────────────────────────────────────────────────
services:
  celery_worker:
    environment:
      DJANGO_DEBUG: "False"

  celery_beat:
    environment:
      DJANGO_DEBUG: "False"

  backend:
    restart: always
    environment:
      DJANGO_DEBUG: "False"
    # ASGI (daphne) car l'app utilise des websockets (chat + notifications).
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    expose:
      - "8000"

  frontend:
    restart: always
    build:
      context: ./frontend
      target: runner
      # NEXT_PUBLIC_* sont inlinées au build. En prod le navigateur passe par
      # nginx (443) : pointer l'API sur https://localhost (surchargeable via .env).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_PROD:-https://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    expose:
      - "3000"

  nginx:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: t_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - t_networks
