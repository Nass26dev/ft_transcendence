[pytest]
# Les tests forment UN parcours utilisateur continu (inscription → login →
# navigation → déconnexion) partageant un seul navigateur : l'ordre des
# fichiers, alphabétique, fait partie du scénario. Ne pas paralléliser
# (pytest-xdist) ni randomiser l'ordre.
testpaths = .
python_files = test_*.py
addopts = -v --tb=short --strict-markers
